name: Build ARM Core

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install ARM Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf make

    - name: Build Core for ARMhf
      run: |
        make -f Makefile.libretro CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++
        
    - name: Upload Core
      uses: actions/upload-artifact@v4
      with:
        name: genesis_plus_gx_armhf
        path: genesis_plus_gx_libretro.so
